
buildscript {
    ext {
        springBootVersion = '3.3.4'
        jacksonVersion = '2.12.2'
        feignVersion = '11.0'
        swaggerVersion = '1.5.18'
        apacheCommonsVersion = '3.5'
    }
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven { url 'https://repo.jenkins-ci.org/releases/' }
        maven { url 'https://jitpack.io' }
    }
}
plugins {
    // Nebula plugins removed as per deprecation/issue resolution
    // id 'nebula.project' version '3.4.0'
    // id 'nebula.info' version '3.6.0'
    // id 'nebula.release' version '6.0.0'
    // id 'nebula.lint' version '6.8.0'
    id 'checkstyle'
    id 'io.freefair.lombok' version '8.10.2'
    id 'com.github.ben-manes.versions' version '0.14.0'
}

// ---- ensure version is set; default to 0.0.0-SNAPSHOT if not provided by CI
if (!project.hasProperty('version') || project.version == 'unspecified') {
    version = System.getenv('BUILD_VERSION') ?: '0.0.0-SNAPSHOT'
}


allprojects {
    apply plugin: 'java'
    apply plugin: 'project-report'
    apply plugin: 'maven-publish'

    repositories {
        mavenCentral()
        mavenLocal()
        gradlePluginPortal()
    }

    group = 'org.amv.trafficsoft'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    configurations.all {
        resolutionStrategy {
            preferProjectModules()
            // fail eagerly on version conflict (includes transitive dependencies)
            // e.g. multiple different versions of the same dependency (group and name are equal)
            failOnVersionConflict()

            dependencySubstitution {
                substitute module('javax.validation:validation-api') using module('jakarta.validation:jakarta.validation-api:3.0.2')
                substitute module('javax.annotation:javax.annotation-api') using module('jakarta.annotation:jakarta.annotation-api:2.1.1')
                substitute module('javax.ws.rs:javax.ws.rs-api') using module('jakarta.ws.rs:jakarta.ws.rs-api:3.1.0')
                substitute module('javax.servlet:javax.servlet-api') using module('jakarta.servlet:jakarta.servlet-api:6.0.0')
                substitute module('javax.xml.bind:jaxb-api') using module('jakarta.xml.bind:jakarta.xml.bind-api:4.0.0')
                substitute module('javax.activation:activation') using module('jakarta.activation:jakarta.activation-api:2.1.2')
            }

            force 'com.netflix.archaius:archaius-core:0.6.6',
                    'org.slf4j:slf4j-api:1.7.25',
                    'com.google.guava:guava:22.0',
                    'org.reactivestreams:reactive-streams:1.0.1',
                    "io.github.openfeign:feign-core:${feignVersion}",
                    "com.fasterxml.jackson.core:jackson-core:${jacksonVersion}",
                    "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}",
                    "com.fasterxml.jackson.core:jackson-annotations:${jacksonVersion}",
                    "com.fasterxml.jackson.datatype:jackson-datatype-jdk8:${jacksonVersion}",
                    "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonVersion}",
                    "com.fasterxml.jackson.module:jackson-module-parameter-names:${jacksonVersion}",
                    'commons-logging:commons-logging:1.2',
                    'org.jetbrains.kotlin:kotlin-stdlib:1.3.70',
                    'junit:junit:4.13.1',
                    'org.hamcrest:hamcrest:2.2',
                    'net.bytebuddy:byte-buddy:1.14.12',
                    'net.minidev:json-smart:2.5.1',
                    'org.junit.jupiter:junit-jupiter-api:5.10.3'
        }
    }
}

subprojects {
    apply plugin: 'checkstyle'
    apply plugin: 'jacoco'
    // Nebula plugins removed
    // apply plugin: 'nebula.lint'
    // apply plugin: 'nebula.project'
    // apply plugin: 'nebula.info'
    apply plugin: 'io.freefair.lombok'

    dependencies {
        constraints {
            testImplementation('net.bytebuddy:byte-buddy:1.14.12') { because 'Align across modules to avoid version conflict' }
            testImplementation('junit:junit:4.13.1') { because 'Align JUnit 4 across modules' }
            testImplementation('org.hamcrest:hamcrest:2.2') { because 'Use modern Hamcrest bundle' }
        }
        implementation 'com.google.guava:guava:22.0'

        testImplementation 'junit:junit:4.13.1'
        testImplementation 'org.hamcrest:hamcrest:2.2'
        testImplementation 'pl.pragmatists:JUnitParams:1.0.6'
        testImplementation "org.apache.commons:commons-lang3:${apacheCommonsVersion}"
    }

    gradle.taskGraph.whenReady { graph ->
        def isMinimalBuild = project.hasProperty("minimal")

        def enableAdditionalLongRunningTasks = !isMinimalBuild

        if (!enableAdditionalLongRunningTasks) {
            checkstyleMain.enabled = false
            javadoc.enabled = false
        }
    }


    // With io.freefair.lombok, delombok integration is handled by the plugin.
    // Keep javadoc simple and tolerant.
    javadoc {
        // do not fail the build on javadoc issues
        failOnError = false
        options.noTimestamp = true
        options.locale 'en_US'
        title = "${project.name}"
        // Use normal sources (Lombok handled by plugin/toolchain)
        source = sourceSets.main.allJava
    }

    task copyJavadoc(type: Copy) {
        from javadoc
        into rootProject.file("docs/${project.name}/javadoc/")
    }

    build.dependsOn copyJavadoc

    clean.doLast {
        rootProject.file("docs/${project.name}/javadoc/").deleteDir()
    }

    jar.doFirst {
        def vendor = 'AMV Networks GmbH'
        manifest {
            attributes(
                    'Specification-Title': project.description,
                    'Specification-Version': project.version,
                    'Specification-Vendor': vendor,
                    'Implementation-Vendor': vendor
            )
        }
    }

    task sourcesJar(type: Jar) {
        archiveClassifier.set('sources')
        from sourceSets.main.allSource
    }

    task testJar(type: Jar) {
        archiveClassifier.set('test')
        from sourceSets.test.output
    }

    // Package Javadoc into a jar for publishing
    task javadocJar(type: Jar, dependsOn: javadoc) {
        archiveClassifier.set('javadoc')
        from javadoc.destinationDir
    }


    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                artifact sourcesJar
                artifact javadocJar
                groupId = project.group
                artifactId = project.name
                version = project.version
            }
        }
        repositories {
            maven {
                name = 'trafficsoft'
                url = uri('https://pkgs.dev.azure.com/autologg/_packaging/trafficsoft/maven/v1')
                credentials {
                    // Azure Artifacts requires any non-empty username and a Personal Access Token as password
                    username = 'autologg'
                    password = System.getenv('PAT') ?: System.getenv('VSTS_MAVEN_ACCESS_TOKEN')
                }
                authentication {
                    basic(BasicAuthentication)
                }
            }
        }
    }

    checkstyle {
        configFile = rootProject.file('config/checkstyle/checkstyle.xml')
        toolVersion = '6.7'
        ignoreFailures = true
        showViolations = false
        sourceSets = [sourceSets.main]
        reportsDir = rootProject.file("$buildDir/reports/checkstyle")
    }


    task subprojectsDependencies(type: DependencyReportTask) {

    }

    test {
        // Generate code coverage reports ... run with jacoco
        jacocoTestReport {
            additionalSourceDirs = files(sourceSets.main.allJava.srcDirs)
            reports {
                xml.required.set(true)
                csv.required.set(false)
                html.required.set(true)
                html.outputLocation.set(file("${buildDir}/reports/jacoco/html"))
            }
            executionData = files("${buildDir}/jacoco/test.exec")
        }

        // * enable on demand
        // testLogging.showStandardStreams = true
        finalizedBy jacocoTestReport
    }

}
